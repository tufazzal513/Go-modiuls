name: vendor
on: workflow_dispatch
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: |
          mkdir wanime-go && cd wanime-go
          go mod init wanime
          cat > deps.go <<'EOF'
          package main

          import (
          	_ "github.com/gotd/td/session"
          	_ "github.com/gotd/td/telegram"
          	_ "github.com/gotd/td/telegram/auth"
          	_ "github.com/gotd/td/telegram/downloader"
          	_ "github.com/gotd/td/telegram/message"
          	_ "github.com/gotd/td/telegram/uploader"
          	_ "github.com/gotd/td/tg"
          	_ "modernc.org/sqlite"
          )

          func main() {}
          EOF
          go mod tidy
          go mod vendor
          git init -q -b vendor
          git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm "go vendor"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" vendor
